name: Live service

# Checks that the real MeteoGate service still behaves as the client expects.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest -m live -v
